<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qualitech Computers | LeTip Round Table</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="contact-page">

  <!-- MAIN CONTACT CARD (centered container) -->
  <section class="contact-card">

    <!-- COMPANY LOGO -->
    <img src="images/logos/original/qualitech-computers.png" 
         alt="Qualitech Computers Logo" 
         class="contact-logo">

    <!-- BUSINESS NAME -->
    <h1>Qualitech Computers</h1>

    <!-- BUSINESS CATEGORY / ROLE -->
    <p class="contact-category">Computer Support & IT Services</p>

    <!-- ACTION BUTTONS (primary interactions) -->
    <div class="contact-actions">

      <!-- PHONE LINK (click to call on mobile) -->
      <a href="tel:7188160076" class="btn">Call</a>

      <!-- EMAIL LINK (opens mail app) -->
      <a href="mailto:info@qualitechcomputers.com" class="btn">Email</a>

      <!-- WEBSITE LINK (external navigation) -->
      <a href="https://www.qualitechcomputers.com" class="btn">Website</a>

      <!-- DOWNLOAD CONTACT (vCard file) -->
      <a href="assets/vcards/qualitech.vcf" class="btn" download>Save Contact</a>
    </div>

    <!-- FOOTNOTE / CONTEXT -->
    <p class="contact-note">
      Proud member of LeTip Round Table Staten Island.
    </p>
     <!-- BACK NAVIGATION (returns user to directory page) -->
  <div class="contact-back">
    <a href="directory.html" class="btn">← Back to Directory</a>
  </div>
  </section>

</main>

</body>
</html>
